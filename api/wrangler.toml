name = "videysp-api"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true

[[r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "videysp-videos"

[[d1_databases]]
binding = "DB"
database_name = "videysp-db"
database_id = "REPLACE_WITH_VIDEYSP_D1_DATABASE_ID"

[triggers]
crons = ["*/15 * * * *"]

# Harmless commit to trigger the Git-connected Cloudflare deployment.
