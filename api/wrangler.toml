name = "ourvidey-api"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true

[[r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "ourvidey-videos"

[[d1_databases]]
binding = "DB"
