name = "videyclv-api"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true

[[r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "videyclv-videos"

[[d1_databases]]
binding = "DB"
database_name = "videyclv-db"
database_id = "5a33545c-449f-4289-9d40-3abc7fa97e47"

[triggers]
crons = ["*/15 * * * *"]

